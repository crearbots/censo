<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe semanal - InfoMIRA Censo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-blue-800 text-white shadow">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">InfoMIRA Censo</h1>
                <p class="text-blue-200 text-sm">Comunidad de Carvajal</p>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm text-blue-100">{{ user }}</span>
                <a href="/logout" class="text-sm bg-blue-700 hover:bg-blue-600 px-3 py-1 rounded transition">
                    Cerrar sesión
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-8">
        <div class="mb-6">
            <a href="/dashboard" class="text-blue-600 hover:underline text-sm">← Volver al Dashboard</a>
            <h2 class="text-2xl font-semibold text-gray-800 mt-2">Informe semanal</h2>
            <p class="text-gray-600 text-sm">Texto listo para copiar y pegar en WhatsApp</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-medium text-gray-800">Vista previa</h3>
                <button id="btnCopiar"
                        class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition text-sm font-medium">
                    📋 Copiar al portapapeles
                </button>
            </div>

            <pre id="textoInforme"
                 class="bg-gray-50 border border-gray-200 rounded-lg p-4 text-sm whitespace-pre-wrap font-sans text-gray-800 leading-relaxed">{{ texto_informe }}</pre>

            <p id="mensajeCopiado" class="text-green-600 text-sm mt-3 hidden">✓ Texto copiado. Ya lo puedes pegar en WhatsApp.</p>
        </div>

        <a href="/dashboard"
           class="inline-block bg-gray-200 text-gray-700 px-5 py-2.5 rounded-md hover:bg-gray-300 transition">
            Volver al Dashboard
        </a>
    </main>

    <script>
        document.getElementById('btnCopiar').addEventListener('click', async function () {
            const texto = document.getElementById('textoInforme').innerText;
            try {
                await navigator.clipboard.writeText(texto);
                const msg = document.getElementById('mensajeCopiado');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 3000);
            } catch (err) {
                // Fallback para navegadores antiguos
                const range = document.createRange();
                range.selectNode(document.getElementById('textoInforme'));
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand('copy');
                window.getSelection().removeAllRanges();
                const msg = document.getElementById('mensajeCopiado');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 3000);
            }
        });
    </script>
</body>
</html>
